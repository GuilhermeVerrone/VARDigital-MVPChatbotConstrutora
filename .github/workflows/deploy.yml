name: Deploy
# Em cada push na main: testa, constrói as imagens no GHCR e atualiza a VPS por SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mvp-construtora

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: bot,     file: apps/bot/Dockerfile,           args: "" }
          - { name: site,    file: infra/docker/next.Dockerfile,  args: "APP=site" }
          - { name: painel,  file: infra/docker/next.Dockerfile,  args: "APP=painel" }
          - { name: migrate, file: infra/docker/migrate.Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=${IMAGE_PREFIX,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Chave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Enviar compose e Caddyfile
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'mkdir -p ~/app/infra/caddy'
          scp infra/docker-compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app/infra/
          scp infra/caddy/Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app/infra/caddy/
      - name: Atualizar a VPS
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' TAG='$TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/app/infra
          # A VPS já guarda o login do GHCR; o token do secret, se existir, renova.
          if [ -n "$GHCR_TOKEN" ]; then echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; fi
          sed -i "s/^TAG=.*/TAG=$TAG/" .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod pull bot site painel migrate caddy
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          REMOTE
